services:
  activepieces-proxy:
    image: nginx:1.27-alpine
    container_name: activepieces-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACTIVEPIECES_SERVER_NAME: ${ACTIVEPIECES_SERVER_NAME}
      ACTIVEPIECES_UPSTREAM: ${ACTIVEPIECES_UPSTREAM}
      MODELGROW_VERIFY_URL: ${MODELGROW_VERIFY_URL}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/brand:/usr/share/nginx/modelgrow-brand:ro
      - ../../public:/usr/share/nginx/modelgrow-public:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: >
      /bin/sh -c "
      envsubst '$$ACTIVEPIECES_SERVER_NAME $$ACTIVEPIECES_UPSTREAM $$MODELGROW_VERIFY_URL'
      < /etc/nginx/templates/activepieces.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'
      "

  certbot:
    image: certbot/certbot:latest
    container_name: activepieces-certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
